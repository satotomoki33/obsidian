name: Sync X posts to Obsidian

on:
  schedule:
    # 23:30 JST = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/sync_twitter.py
      - .github/workflows/sync-twitter.yml

permissions:
  contents: write

concurrency:
  group: sync-twitter-log
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch new X posts
        env:
          X_USERNAME: sato_mega33
          X_LOG_PATH: Twitterログ.md
          START_AT: "2026-07-28T21:43:00+09:00"
        run: python scripts/sync_twitter.py

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- "Twitterログ.md"; then
            echo "No new posts; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Twitterログ.md"
          git commit -m "Xログを更新: $(TZ=Asia/Tokyo date +%F)"
          git push origin HEAD:main
